<!doctype html>
<html lang="zh-CN">
<head>

<body>
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="打开目录">目录</button>
    <div class="heading"><strong id="pageTitle">联合家化产品电子书</strong><span id="pageMeta">专题6</span></div>
    <button id="homeBtn" class="icon-btn" aria-label="返回主目录">主目录</button>
  </header>
  <main id="viewer" class="viewer" aria-live="polite">
    <button id="prevTap" class="tap-zone left" aria-label="上一页"></button>
    <figure class="page"><img id="pageImage" alt="" draggable="false"><div id="hotspots" class="hotspots"></div><div id="loading">正在加载…</div></figure>
    <button id="nextTap" class="tap-zone right" aria-label="下一页"></button>

  <nav class="bottomnav" aria-label="阅读导航">

  </nav>
  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head"><strong>全书目录</strong><button id="closeBtn" aria-label="关闭目录">关闭</button></div>

  <div id="lightbox" class="lightbox" hidden><button id="lightboxClose" aria-label="关闭放大图片">×</button><img id="lightboxImage" alt=""><div id="lightboxCaption"></div></div>
  <script>
const pages = [

  {id:"JGB-P001",title:"金箍棒气雾剂系列",section:"金箍棒",src:"pages/JGB-P001.jpg"},
  {id:"JGB-P002",title:"金箍棒电热蚊香液系列",section:"金箍棒",src:"pages/JGB-P002.jpg"},
  {id:"SEC-LS",title:"力沙产品专区（原图待补）",section:"力沙",src:"pages/SEC-LS.jpg"},
  {id:"SEC-HC",title:"家庭日化产品专区",section:"家庭日化",src:"pages/SEC-HC.jpg"},
  {id:"HC-P001",title:"花露水系列",section:"家庭日化",src:"pages/HC-P001.jpg"},
  {id:"HC-P002",title:"健字厕净（柠檬香）",section:"家庭日化",src:"pages/HC-P002.jpg"},
  {id:"HC-P003",title:"空气清新剂系列",section:"家庭日化",src:"pages/HC-P003.jpg"},
  {id:"COOP-001",title:"选择联合家化",section:"招商合作",src:"pages/COOP-001.jpg"},
  {id:"COOP-002",title:"渠道合作价值",section:"招商合作",src:"pages/COOP-002.jpg"},
  {id:"COOP-003",title:"合作模式",section:"招商合作",src:"pages/COOP-003.jpg"},
  {id:"CONTACT",title:"联系方式",section:"联系我们",src:"pages/CONTACT.jpg"}
];
const byId = Object.fromEntries(pages.map((p,i)=>[p.id,i]));
let current = Math.max(0, byId[location.hash.slice(1)] ?? 0);
const image = document.querySelector('#pageImage');
const hotspots = document.querySelector('#hotspots');
const loading = document.querySelector('#loading');
const lightbox=document.querySelector('#lightbox'),lightboxImage=document.querySelector('#lightboxImage'),lightboxCaption=document.querySelector('#lightboxCaption');
const drawer = document.querySelector('#drawer');
const shade = document.querySelector('#shade');
const toc = document.querySelector('#toc');
function preload(i) { if (pages[i]) { const x=new Image(); x.src=pages[i].src; } }
const links = {
  'COVER': [[0,0,100,100,'DIR-001','进入全书主目录']],
  'DIR-001': [
    [7.4,22.4,85.2,12.3,'ENT-INTRO','进入企业篇'],[7.4,37.2,85.2,12.3,'SEC-JZ','进入品牌与产品'],
    [7.4,52.1,85.2,12.3,'COOP-001','进入招商合作'],[7.4,66.9,85.2,12.3,'CONTACT','进入联系方式']],
  'ENT-MARKET': [[7.4,77.0,85.2,8.5,'SEC-JZ','查看品牌与产品']],
  'ENT-INTRO': [[10.2,36.7,38,14.8,'@asset:营业执照.jpg','查看营业执照大图'],[51.8,36.7,38,14.8,'@asset:农药生产许可证.jpg','查看农药生产许可证大图'],[10.2,51.9,38,14.8,'@asset:农药登记证_代表证.jpg','查看农药登记证大图'],[51.8,51.9,38,14.8,'@asset:河北省科技型中小企业.jpg','查看科技型中小企业证书大图']],
  'SEC-JZ': ['JZ-P001','JZ-P001B','JZ-P002','JZ-P003','JZ-P004','JZ-P005','JZ-P006','JZ-P007'],
  'SEC-YJ': ['YJ-P001','YJ-P002','YJ-P003','YJ-P004'],
  'SEC-JGB': ['JGB-P001','JGB-P002'],
  'SEC-HC': ['HC-P001','HC-P002','HC-P003'],
  'CONTACT': [[7.4,43.5,85.2,12,'@tel','拨打0312-2161615'],[7.4,87.5,85.2,6.5,'DIR-001','返回全书主目录']]
};
const productImages={
 'JZ-P001':['015','018','025','022'],'JZ-P001B':['016','017','026'],'JZ-P002':['063','064'],
 'JZ-P003':['089','006','007','003'],'JZ-P004':['058','053'],'JZ-P005':['008','004','005','051'],'JZ-P006':['090'],'JZ-P007':['043','083','088','081'],
 'YJ-P001':['049','050','059','060'],'YJ-P002':['045'],'YJ-P003':['013','018','020','023'],'YJ-P004':['021'],
 'JGB-P001':['091','024','027'],'JGB-P002':['071','070','068','069'],'HC-P001':['035','067','065'],'HC-P002':['010'],'HC-P003':['030','028','029','031']};
const productLayout={4:[[7.4,21.3,40.9,28.6],[51.7,21.3,40.9,28.6],[7.4,51.9,40.9,28.6],[51.7,51.9,40.9,28.6]],3:[[7.4,21.3,40.9,28.6],[51.7,21.3,40.9,28.6],[29.5,51.9,40.9,28.6]],2:[[7.4,21.5,85.2,26.8],[7.4,50.5,85.2,26.8]],1:[[7.4,21.5,85.2,55.0]]};
function openLightbox(src,label){lightboxImage.src=src;lightboxImage.alt=label;lightboxCaption.textContent=label;lightbox.hidden=false;document.body.classList.add('modal-open')}
function closeLightbox(){lightbox.hidden=true;lightboxImage.src='';document.body.classList.remove('modal-open')}
function sectionLinks(ids) { return ids.map((id,n)=>[7.4+(n%2)*44.3,21.1+Math.floor(n/2)*14.3,40.9,12.2,id,'进入'+pages[byId[id]].title]); }
function renderHotspots(p) {
  hotspots.innerHTML=''; let items=links[p.id]||[]; if(items.length && typeof items[0]==='string') items=sectionLinks(items);
  if(p.id==='COVER') items=[];
  items.forEach(([x,y,w,h,target,label])=>{const b=document.createElement('button');b.className='hotspot';b.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;b.setAttribute('aria-label',label);if(label&&label.includes('进入')){const t=document.createElement('span');t.className='pulse-link';t.innerHTML='进入 <span class="pulse-arrow">→</span>';b.append(t)}b.onclick=()=>{if(target==='@tel'){location.href='tel:03122161615';return}if(target.startsWith('@asset:')){window.open('assets/'+encodeURIComponent(target.slice(7)),'_blank');return}show(byId[target])};hotspots.append(b);});
  const ids=productImages[p.id];if(ids){const pos=productLayout[ids.length];ids.forEach((n,i)=>{const [x,y,w,h]=pos[i];const b=document.createElement('button');b.className='hotspot product-hotspot';b.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;b.setAttribute('aria-label','点击放大产品图片 IMG_'+n);b.onclick=e=>{e.stopPropagation();openLightbox('assets/products/IMG_'+n+'.jpg','真实产品图片 IMG_'+n)};hotspots.append(b)})}
  if(p.id==='COVER'){const b=document.createElement('button');b.className='cover-pulse';b.textContent='进入全书主目录　→';b.onclick=()=>show(byId['DIR-001']);hotspots.append(b)}
  if(p.id==='ENT-MARKET'){const b=document.createElement('span');b.className='market-pulse';b.textContent='查看品牌与产品　→';hotspots.append(b)}
}
function show(i, push=true) {
  current=Math.max(0,Math.min(pages.length-1,i)); const p=pages[current]; loading.hidden=false; image.classList.remove('ready');
  image.onload=()=>{loading.hidden=true;image.classList.add('ready')}; image.src=p.src; image.alt=p.title;
  document.querySelector('#pageTitle').textContent=p.title; document.querySelector('#pageMeta').textContent=p.section;
  document.querySelector('#counter').textContent=`${current+1} / ${pages.length}`;
  renderHotspots(p);
  document.querySelector('#prevBtn').disabled=current===0; document.querySelector('#nextBtn').disabled=current===pages.length-1;
  toc.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===p.id));
  if(push) history.replaceState(null,'','#'+p.id); preload(current-1); preload(current+1);
}
function closeDrawer() {drawer.setAttribute('aria-hidden','true');shade.hidden=true;}
function openDrawer() {drawer.setAttribute('aria-hidden','false');shade.hidden=false;}
function buildToc(filter='') {
  const q=filter.trim().toLowerCase(); toc.innerHTML=''; let last='';
  pages.forEach((p,i)=>{ if(q && !(p.title+p.section+p.id).toLowerCase().includes(q)) return;
    if(p.section!==last){const h=document.createElement('h2');h.textContent=p.section;toc.append(h);last=p.section;}
    const b=document.createElement('button');b.dataset.id=p.id;b.innerHTML=`<span>${p.title}</span><small>${String(i+1).padStart(2,'0')}</small>`;
    b.onclick=()=>{show(i);closeDrawer();};toc.append(b);
  }); show(current,false);
}
document.querySelector('#menuBtn').onclick=openDrawer; document.querySelector('#closeBtn').onclick=closeDrawer; shade.onclick=closeDrawer;
document.querySelector('#homeBtn').onclick=()=>show(byId['DIR-001']); document.querySelector('#prevBtn').onclick=()=>show(current-1);
document.querySelector('#lightboxClose').onclick=closeLightbox;lightbox.onclick=e=>{if(e.target===lightbox)closeLightbox()};
document.querySelector('#nextBtn').onclick=()=>show(current+1); document.querySelector('#prevTap').onclick=()=>show(current-1);
document.querySelector('#nextTap').onclick=()=>show(current+1); document.querySelector('#search').oninput=e=>buildToc(e.target.value);
addEventListener('hashchange',()=>show(byId[location.hash.slice(1)]??current,false));
let sx=0;document.querySelector('#viewer').addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});
document.querySelector('#viewer').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60)show(current+(dx<0?1:-1));},{passive:true});
buildToc(); show(current,false); if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
  </script>
</body></html>
